[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-forecasting"
version = "0.1.0"
description = "Analise de previsao de receitas tributarias municipais (TCC Daniel Jackson Cavalcante Costa, UESC)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Daniel Jackson Cavalcante Costa" }]
keywords = [
    "time-series-forecasting",
    "municipal-finance",
    "sarima",
    "prophet",
    "ets",
    "tcc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # O coletor de dados e dependencia do projeto de analise.
    # Instalar com: pip install -e ../siconfi-collector
    "siconfi-collector",
    # Manipulacao e analise.
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    # Modelos estatisticos classicos.
    "statsmodels>=0.14",
    "pmdarima>=2.0",
    # Modelo estrutural.
    "prophet>=1.1",
    # Visualizacao.
    "matplotlib>=3.7",
    "seaborn>=0.12",
    # Acesso a serie do IPCA via BCB.
    "python-bcb>=0.3",
    # Notebooks.
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
# Ambiente do run canonico (scripts em _precisao_run/): a selecao automatica
# escalavel do statsforecast (AutoETS, AutoARIMA, AutoTheta) que produz o
# portfolio de seis modelos reportado. Pinada em requirements-sf-lock.txt.
precisao = [
    "statsforecast>=2.0",
]

# Sem [project.scripts]: o orquestrador de artefatos vive fora do pacote, em
# analysis/scripts/build_tex_artifacts.py (o entry-point antigo apontava para
# forecasting.scripts.build_tex_artifacts, modulo que nunca existiu). Uso:
#   python scripts/build_tex_artifacts.py --all

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
